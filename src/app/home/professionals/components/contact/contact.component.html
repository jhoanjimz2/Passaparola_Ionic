<section class="w-full h-full flex flex-col gap-4 p-[1.1875rem] bg-white">

  <div class="grid grid-cols-2">
    <div class="col-span-1">
      <span class="block text-[1.375rem] font-bold">Contatti</span>
    </div>
  </div>

  <!-- EMAIL -->
  <div *ngIf="professional.email" class="w-full p-4 border border-solid border-[#D8E2E8] rounded-[0.875rem] bg-white flex flex-row items-center justify-between">
    <div class="flex flex-col">
      <span class="font-normal text-[0.75rem] text-black">Email</span>
      <span class="font-bold text-[0.875rem] text-black">{{ professional.email }}</span>
    </div>
    <button
      (click)="copyToClipboard(professional.email)"
      class="w-[4.6875rem] h-[1.9375rem] rounded-[1rem] bg-[#E1EAF1] border border-solid border-[#E1E1E1] text-black text-[0.875rem]">
      Copia
    </button>
  </div>

  <!-- TELEFONO -->
  <div *ngIf="professional.phoneNumber" class="w-full p-4 border border-solid border-[#D8E2E8] rounded-[0.875rem] bg-white flex flex-row items-center justify-between">
    <div class="flex flex-col">
      <span class="font-normal text-[0.75rem] text-black">Telefono</span>
      <span class="font-bold text-[0.875rem] text-black">
        {{ (professional.country?.phonePrefix || '')+ ' ' + professional.phoneNumber}}
      </span>
    </div>
    <button
      (click)="copyToClipboard(professional.country?.phonePrefix + ' ' + professional.phoneNumber)"
      class="w-[4.6875rem] h-[1.9375rem] rounded-[1rem] bg-[#E1EAF1] border border-solid border-[#E1E1E1] text-black text-[0.875rem]">
      Copia
    </button>
  </div>

</section>
