<app-header
  [border]="true"
  [backIcon]="true"
  [modalDismiss]="true"
  #header
></app-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <p class="profesional-title">
          {{ profesional_demo_selected.title }}
        </p>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <p class="profesional-subtitle">
          {{ profesional_demo_selected.subtitle }}
        </p>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <p class="profesional-content">
          {{ profesional_demo_selected.content }}
        </p>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <swiper-container
          style="width: 100%; height: 420px"
          #my_swiper
          [init]="false"
          [allowTouchMove]="false"
          (swiperslidechange)="onSlideChange($event)"
        >
          <swiper-slide>
            <img src="assets/images/profesional_1.png" />
          </swiper-slide>
          <swiper-slide>
            <img src="assets/images/profesional_2.png" />
          </swiper-slide>
          <swiper-slide>
            <img src="assets/images/profesional_3.png" />
          </swiper-slide>
          <swiper-slide>
            <img src="assets/images/profesional_4.png" />
          </swiper-slide>
        </swiper-container>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid>
    <ion-row>
      <ion-col size="12" class="flex ion-justify-content-between">
        <ion-button
          size="default"
          color="dark"
          fill="clear"
          (click)="swiperPrev(my_swiper)"
          class="swiper-button-prev w-100"
        >
          Indietro
        </ion-button>

        <ion-button
          size="default"
          color="warning"
          (click)="swiperNext(my_swiper)"
          class="swiper-button-next w-100"
        >
          {{ textButton }}
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
