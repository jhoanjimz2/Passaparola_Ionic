<app-header
  [border]="true"
  [backIcon]="true"
  [modalDismiss]="true"
></app-header>
<ion-content>


  <section class="mt-[2rem]">
    <div class="px-4">
      <label class="text-[22px] text-black font-semibold">I voucher creati da te</label>
    </div>
  </section>

  <div class="grid grid-cols-2 gap-2 p-2 pt-[1rem] mb-4">
    <div (click)="openCreateVoucher()" class="py-2 w-full flex flex-col justify-center items-center bg-white border-2 border-black border-dashed rounded-[16px]">
      <label class="text-[30px] text-black font-bold">+</label>
      <label class="text-[14px] text-black text-center">CREA NUOVO VOUCHER</label>
      <label class="text-[14px] text-black text-center">clicca qui per iniziare</label>
    </div>
    <div class="py-2 w-full flex flex-col justify-center items-center bg-white border-2 border-black border-dashed rounded-[16px]">
      <label class="text-[30px] text-black font-bold">+</label>
      <label class="text-[14px] text-black text-center">SCANSIONA DELL'OFFERTA</label>
      <label class="text-[14px] text-black text-center">clicca qui per iniziare</label>
    </div>
  </div>


  <section class="px-2">
    <app-voucher-oferta
      (activeInactive)="activeInactive($event, voucher)"
      [voucher]="voucher"
      [toggle]="true"
      *ngFor="let voucher of vouchersCreated">
    </app-voucher-oferta>
  </section>

</ion-content>
