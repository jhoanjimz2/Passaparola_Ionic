<ion-content>
  <section class="w-full h-full p-4 gap-3 flex flex-col items-center justify-start pt-[2.625rem]">

    <div class="gap-4 flex flex-row w-full h-[9.75rem] rounded-[0.8125rem] bg-white border border-solid border-[#209E12] p-[0.375rem]">

      <ng-container *ngIf="request.socialCommunity.typeFile === 'image'; else videoTemplate">
        <img
          class="w-[6.375rem] rounded-[0.8125rem] h-full object-cover"
          [src]="request.socialCommunity.urlFile || 'https://placehold.co/80x80?text=post'"
        />
      </ng-container>
      <ng-template #videoTemplate>
        <video
          class="w-[6.375rem] rounded-[0.8125rem] h-full object-cover pointer-events-none select-none"
          [src]="request.socialCommunity.urlFile"
          muted
          playsinline
          preload="metadata"
          [attr.poster]="null"
        ></video>
      </ng-template>


      <div class="w-[calc(100%-6.375rem)] h-full flex flex-col justify-around relative">
        <ion-icon class="text-[1.5rem] text-black absolute right-2 top-2" name="eye-outline"></ion-icon>
        <div class="flex flex-row gap-4">
          <img
            class="w-[3.208rem] h-[3.208rem] rounded-[50%] object-cover"
            [src]="'https://placehold.co/50x50?text=profile'"
          >

          <div class="flex flex-col items-start justify-center">
            <span class="text-[0.875rem] font-bold">
              {{ "@username" }}
            </span>
            <span class="text-[0.75rem]">58 paspot</span>
          </div>
        </div>
        <div class="text-start">
          <span class="block text-[0.875rem]">
            ti ha taggato in un <b>Paspot</b>
          </span>
          <span class="block italic text-[0.75rem]">
            {{ request.createdAt | date:'MM/dd/yyyy HH:mm' }}
          </span>
        </div>

        <div class="flex flex-row gap-2">
          <button class="w-full text-transparent h-[2.1875rem] rounded-[1.125rem] text-[0.9rem]">
          </button>
          <button class="w-full text-[#209E12] h-[2.1875rem] rounded-[1.125rem] text-[0.9rem]">
            Accettato
          </button>
        </div>
      </div>

    </div>


    <h1 class="font-bold text-center text-[1.125rem]">Vuoi davvero rimuovere questo tag?</h1>

    <p class="text-center text-[0.875rem] m-0">
      Hai già accettato questo tag, se lo vuoi<br>
      rimuovere, conferma l'operazione cliccando<br>
      sul bottone <b>"Rimuovi Tag"</b>, altrimenti annulla<br>
      l'operazione
    </p>

    <button (click)="accept()" class="w-[10.6875rem] h-[3.25rem] rounded-[1.625rem] bg-[#888888] border border-solid border-[#E1E1E1] text-white font-normal">
      Rimuovi Tag
    </button>
    <button (click)="close()" class="w-[10.6875rem] h-[3.25rem] rounded-[1.625rem] bg-transparent text-black font-bold">
      Annulla
    </button>

  </section>
</ion-content>
