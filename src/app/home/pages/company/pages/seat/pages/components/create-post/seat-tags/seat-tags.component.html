<section class="p-4 bg-white h-full flex flex-col justify-between">

  <div class="w-full">
    <h2 class="text-lg font-bold">Parole chiave</h2>
    <p class="text-sm text-gray-600">
      Aggiungi fino a {{ maxTags }} parole chiave (es. pizza, carne, pesce).
    </p>

    <!-- Input -->
    <div class="relative mt-3">
      <input
        [(ngModel)]="search"
        (keydown)="onKeyDown($event)"
        type="text"
        class="w-full border rounded-xl p-2.5 text-sm focus:outline-none"
        placeholder="Inizia a scrivere..."
      />
    </div>

    <!-- Tags seleccionados -->
    <div class="flex flex-wrap gap-2 mt-3">
      <span
        *ngFor="let tag of selectedTags"
        class="px-3 py-1 rounded-full bg-[#FE8500] text-[#FFFFFF] text-sm font-medium relative"
      >
        {{ tag }}
        <button
          (click)="removeTag(tag); $event.stopPropagation()"
          class="absolute -top-2 -right-2 text-black border rounded-full text-xs px-1"
        >
          ×
        </button>
      </span>
    </div>

    <!-- Lista de sugerencias -->
    <div *ngIf="filteredTags.length && search" class="mt-3 border rounded-xl p-3 max-h-40 overflow-y-auto">
      <div
        *ngFor="let tag of filteredTags"
        (click)="addTag(tag)"
        class="cursor-pointer py-1 text-sm hover:text-orange-600"
      >
        {{ tag }}
      </div>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex justify-between mt-6">
    <button
      class="px-4 py-2 border rounded-lg text-gray-600"
      (click)="cancel()"
    >
      Annulla
    </button>
    <button
      class="px-4 py-2 rounded-lg bg-orange-500 text-white font-bold disabled:opacity-50"
      [disabled]="!selectedTags.length"
      (click)="dismiss()"
    >
      Salva
    </button>
  </div>
</section>
