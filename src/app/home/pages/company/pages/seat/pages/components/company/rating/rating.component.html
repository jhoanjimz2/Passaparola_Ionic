<section class="bg-[#F9F9F9] m-4 rounded-2xl p-6 flex flex-row justify-between items-start shadow-sm">
  <!-- Left: promedio -->
  <section>
    <p class="text-2xl font-semibold text-gray-800">{{ rating }}/5</p>
    <p class="text-sm text-gray-500">{{ totalReviews | number }} reviews</p>

    <!-- Estrellas -->
    <section class="flex mt-2">
      <ng-container *ngFor="let star of [1,2,3,4,5]; let i = index">
        <ion-icon
          name="star"
          class="text-xl"
          [ngClass]="i < roundedRating ? 'text-yellow-400' : 'text-gray-300'"
        ></ion-icon>
      </ng-container>
    </section>
  </section>

  <!-- Right: distribución -->
  <section class="flex flex-col space-y-2 w-1/2">
    <ng-container *ngFor="let item of distribution">
      <section class="flex items-center text-sm">
        <span class="w-3">{{ item.stars }}</span>
        <div class="flex-1 h-3 bg-gray-300 rounded-full mx-2 overflow-hidden">
          <div
            class="h-full bg-yellow-400 rounded-full"
            [style.width.%]="(item.count / maxCount) * 100"
          ></div>
        </div>
        <span class="text-gray-500 w-10 text-right">{{ item.count }}</span>
      </section>
    </ng-container>
  </section>
</section>
