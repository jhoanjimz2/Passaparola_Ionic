<section class="p-4">
  <div class="p-4 w-full bg-white border border-solid border-[#DDE5E9] rounded-[1.1875rem]">
    <div class="grid grid-cols-2 pb-3">
      <div class="col-span-1">
        <span class="block text-[1rem] font-bold text-[#1A1A1A]">Location</span>
      </div>
    </div>

    <google-map
      *ngIf="loadComponent"
      #myGoogleMap
      width="100%"
      [height]="'11.375rem'"
      [center]="center"
      [zoom]="zoom"
      [options]="options"
      class="!rounded-[1.1875rem]"
    >
    </google-map>
  </div>
</section>
