<section class="animate__animated pb-[5rem] animate__fadeIn">
  <ngx-masonry #masonryFeed [options]="masonryOptions" [ordered]="true">
    <div ngxMasonryItem class="grid-sizer"></div>
    <div ngxMasonryItem *ngFor="let post of postsFeedSimilar" class="masonry-item relative">
      <app-post-feed
        (onVideoLoaded)="onVideoLoaded()"
        [post]="post"
      >
      </app-post-feed>
    </div>
  </ngx-masonry>
</section>
