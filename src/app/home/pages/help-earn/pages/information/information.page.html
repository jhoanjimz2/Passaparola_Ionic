<app-header [backIcon]="true" [border]="true"></app-header>
<ion-content [fullscreen]="true" class="main-container">
  <ion-card
    style="background: transparent; box-shadow: none; text-align: center"
  >
    <ion-text>
      <span class="main-container__text"
        >{{"BUG_REPORT.INFORMATION.WE_GIVE" | translate}}</span
      >
      <br />
      <span class="main-container__text"
        >{{"BUG_REPORT.INFORMATION.ONE_EURO" | translate}}</span
      >
    </ion-text>

    <br />
    <br />

    <div class="main-container__img">
      <img src="assets/images/bug-reward.png" alt="Recompensa" />
    </div>

    <br />
    <br />

    <ion-text>
      <span class="main-container__text"
        >{{"BUG_REPORT.INFORMATION.FOR_EACH_BUG" | translate}}</span
      >
      <br />
      <span class="main-container__text"
        >{{"BUG_REPORT.INFORMATION.YOU_FIND" | translate}}</span
      >
    </ion-text>

    <br />
    <br />

    <div class="main-container__btn">
      <ion-button (click)="goToRegiter()">
        {{'BUG_REPORT.INFORMATION.NEXT' | translate}}
      </ion-button>
    </div>
  </ion-card>
</ion-content>
