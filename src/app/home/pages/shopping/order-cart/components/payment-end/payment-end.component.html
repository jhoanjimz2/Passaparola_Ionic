
<div class="h-screen overflow-auto bg-white p-4">

  <!-- Contenido interno, centrado con flex -->
  <div class="flex flex-col justify-center items-center gap-[2rem] text-center min-h-full">


  <img src="assets/images/icono-payment-end.png" class="" alt="">


  <div class="flex flex-col">
    <h1 class="text-xl font-bold">
      Pagamento riuscito
    </h1>
    <p class="text-base text-black/80">
      Questo è il riepilogo del tuo ordine
    </p>
  </div>

  <div class="grid grid-cols-12 gap-1 border border-solid border-[#E1E1E1] rounded-xl py-4 px-2">

    <div class="col-span-12 flex flex-col text-center">
      <label class="text-black text-[1rem] font-bold truncate">Totale pagato</label>
      <label class="text-black text-[1.2rem] font-semibold truncate"><span class="text-[2rem] font-[900]">188,98</span> €/ATM</label>
    </div>

    <swiper-container class="col-span-12 w-full my-2" slides-per-view="auto" space-between="10px">
      <swiper-slide
        class="w-[6.188rem]"
        *ngFor="let producto of productos; let i = index"
        [ngClass]="{ 'mr-[10px]': productos.length === i + 1 }">
        <img
          [src]="producto || 'assets/images/events/categories/ufficiali.png' | imageEvent"
          class="w-full h-full object-cover rounded-[.938rem] p-2 border border-solid border-[#E1E1E1]"
        />
      </swiper-slide>
    </swiper-container>

    <div class="col-span-12 flex flex-col text-right my-2">
      <label class="text-black truncate text-[15px] flex items-center justify-center gap-1">
        <ion-icon name="passaparola-done-icon"></ion-icon> hai ricevuto
      </label>
    </div>



    <div class="col-span-6 flex flex-col text-center">
      <label class="text-black text-[2rem] font-[900] truncate">1,8299</label>
      <label class="text-black text-[1rem] truncate">Punti Ricompensa</label>
    </div>
    <div class="col-span-6 flex flex-col text-center">
      <label class="text-black text-[2rem] font-[900] truncate">0,5587</label>
      <label class="text-black text-[1rem] truncate">Cashback</label>
    </div>

  </div>





  <div class="w-full flex flex-row gap-6">
    <button class="w-full py-4 rounded-full border border-solid border-[#FE8C0F] text-[#FE8C0F]">Vedi ricevuta</button>
    <button class="w-full py-4 rounded-full bg-[#FE8C0F] text-white">Torna alla home</button>
  </div>


</div>
</div>
