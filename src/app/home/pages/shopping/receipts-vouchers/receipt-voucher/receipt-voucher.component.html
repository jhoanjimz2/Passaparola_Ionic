<div class="grid grid-cols-12 gap-1 border border-solid border-[#E1E1E1] rounded-xl py-4 px-2 mt-2">


  <div class="col-span-2">
    <div class="mx-auto w-10 h-10 rounded-full bg-white shadow-[0_8px_30px_rgba(0,0,0,0.25)] flex items-center justify-center">

    </div>
  </div>
  <div class="col-span-5 flex flex-col text-left">
    <label class="text-black font-semibold truncate text-[15px]">Nome Negozio dove hai acqowioeiwoieowioeiwoeiow</label>
    <label class="text-black font-semibold truncate text-[15px]">ID 147845785474588</label>
  </div>
  <div class="col-span-5 flex flex-col text-right">
    <label class="text-black font-semibold truncate text-[15px]">04/04/2025, 15:18</label>
    <label class="text-black font-semibold truncate text-[15px] flex items-center justify-end gap-1">
      <ion-icon name="passaparola-done-icon"></ion-icon>
      Pagato
    </label>
  </div>


  <swiper-container class="col-span-12 w-full my-2" slides-per-view="auto" space-between="10px">
    <swiper-slide
      class="w-[6.188rem]"
      *ngFor="let producto of productos; let i = index"
      [ngClass]="{ 'mr-[10px]': productos.length === i + 1 }">
      <img
        [src]="producto || 'assets/images/events/categories/ufficiali.png' | imageEvent"
        class="w-full h-full object-cover rounded-[.938rem] p-2 border border-solid border-[#E1E1E1]"
      />
    </swiper-slide>
  </swiper-container>



  <div class="col-span-4 flex flex-col text-center">
    <label class="text-black text-[15px] truncate">Pagato €/ATM</label>
    <label class="text-black text-[18px] font-bold truncate">1477,88</label>
  </div>
  <div class="col-span-4 flex flex-col text-center">
    <label class="text-black text-[15px] truncate">Cashback</label>
    <label class="text-black text-[18px] font-bold truncate">7,38</label>
  </div>
  <div class="col-span-4 flex flex-col text-center">
    <label class="text-black text-[15px] truncate">Punti Ricompensa</label>
    <label class="text-black text-[18px] font-bold truncate">110,22</label>
  </div>

  <div *ngIf="voucher" class="col-span-12 mx-2 my-4 border-t border-solid border-[#E1E1E1]"></div>

  <div *ngIf="voucher" class="col-span-5 border border-solid border-[#E1E1E1] rounded-xl p-1">
    <ngx-qrcode-styling class="w-full aspect-square flex" [config]="config"></ngx-qrcode-styling>
  </div>
  <div *ngIf="voucher" class="text-center flex flex-col justify-around h-full col-span-7 border border-solid border-[#E1E1E1] rounded-xl">
    <label class="text-[16px] font-semibold text-black">Data di scadenza</label>
    <label class="text-[22px] font-bold text-[#FB0000]">04/04/2025</label>
    <label class="text-[16px] font-semibold text-black">Penale di non utilizzo</label>
    <label class="text-[22px] font-bold text-[#FB0000]">30%</label>
  </div>

</div>
