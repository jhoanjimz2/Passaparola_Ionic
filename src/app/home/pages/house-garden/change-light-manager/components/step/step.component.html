<section class="w-full flex items-center justify-around py-4">

  <button class="step-button" [ngClass]="{'step-button-active': currentStep === 1}">1</button>
  <button class="step-button" [ngClass]="{'step-button-active': currentStep === 2}">2</button>
  <button class="step-button" [ngClass]="{'step-button-active': currentStep === 3}">3</button>
  <button class="step-button" [ngClass]="{'step-button-active': currentStep === 4}">4</button>

</section>
