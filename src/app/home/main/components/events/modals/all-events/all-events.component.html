<app-header
  [border]="true"
  [backIcon]="true"
  [modalDismiss]="true"
></app-header>
<ion-content [fullscreen]="true">
  <ion-refresher (ionRefresh)="handleRefresh($event)" slot="fixed">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>


  <div class="flex flex-col mt-4 px-4 gap-2">
    <label class="text-[1.2rem] text-black font-bold">Prossimi eventi</label>
    <label class="text-[1rem] text-black">Acquista i biglietti per gli eventi futuri</label>
  </div>

  <div class="mt-4 px-4">
    <app-search-bar
      [categorySelect]="categorySelect"
      [selectIdsCategories]="selectCategories"
      (selectCategories)="searchForCategories($event)">
    </app-search-bar>
  </div>


  <app-nearest-event-card
    class="main__nearest-event"
    *ngFor="let event of selectCategories.length ? allEventsFilter : allEvents; let i = index"
    [event]="event">
  </app-nearest-event-card>


</ion-content>
