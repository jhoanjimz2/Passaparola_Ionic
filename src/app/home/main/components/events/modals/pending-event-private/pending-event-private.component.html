<div class="bg-[#FFFFFF60] text-black p-8 flex flex-col h-full justify-center gap-[3rem]">
  <div
    class="mx-auto
    w-[7rem] h-[7rem] rounded-[3.5rem]
    bg-[#EC097333] text-[3rem]
    flex items-center justify-center">
    <ion-icon name="passaparola-icon-clock-pink"></ion-icon>
  </div>

  <div class="grid grid-cols-2">
    <label class="text-center col-span-2 text-[#000000] font-bold text-[2rem]">
      Disponibile a breve
    </label>
  </div>

  <div class="grid grid-cols-2">
    <label class="text-center col-span-2 text-[#000000] text-[1rem]">
      A breve potrai creare eventi privati, feste di laurea, compleanni, addio al celibato e tanto altro anche se non sei un'azienda. <br><br>
      Gli eventi privati non sono visibili sulle mappe, così potrai invitare solo chi vuoi tu.
    </label>
  </div>

  <button
    (click)="closeModal()"
    class="flex justify-center items-center py-4
      w-[250px] rounded-full bg-[#EC0973] mx-auto text-[16px]
      border-[2px] border-[#EC0973] border-solid text-white font-bold">
    {{ 'Chiudi' }}
  </button>


</div>
