<div class="modal-action-not-valid">
  <div class="modal-action-not-valid__header">
    <ion-button
      class="modal-action-not-valid__close-btn"
      fill="clear"
      (click)="closeModal()"
    >
      <ion-icon name="close" slot="icon-only"></ion-icon>
    </ion-button>
  </div>

  <div class="modal-action-not-valid__content">
    <div class="modal-action-not-valid__icon">
      <ion-icon name="lock-closed-outline"></ion-icon>
    </div>

    <h2 class="modal-action-not-valid__title">
      Ops.
    </h2>

    <p class="modal-action-not-valid__description">
      Devi effettuare l'accesso per accedere a questa funzione. Crea un account o accedi per continuare.
    </p>

    <div class="modal-action-not-valid__actions">
      <ion-button
        class="modal-action-not-valid__btn modal-action-not-valid__btn--primary"
        expand="block"
        (click)="goToLogin()"
      >
        Accedi
      </ion-button>

      <ion-button
        class="modal-action-not-valid__btn modal-action-not-valid__btn--secondary"
        expand="block"
        fill="outline"
        (click)="goToSignUp()"
      >
        Crea account
      </ion-button>

      <ion-button
        class="modal-action-not-valid__btn modal-action-not-valid__btn--text"
        expand="block"
        fill="clear"
        (click)="closeModal()"
      >
        Annulla
      </ion-button>
    </div>
  </div>
</div>
