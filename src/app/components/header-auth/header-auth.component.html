<ion-header class="ion-no-border" mode="md">
  <ion-toolbar>
    <ion-grid>
      <ion-row>
        <ion-col size="1" *ngIf="backIcon">
          <ion-button (click)="backToLogin()">
            <ion-icon color="dark" name="arrow-back"></ion-icon>
          </ion-button>
        </ion-col>
        <ion-col [ngClass]="{ 'col-logo': backIcon }">
          <img src="assets/images/logo-text.png" alt="" width="150px" />
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>
