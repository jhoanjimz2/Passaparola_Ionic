<div class="relative w-full autocomplete-container">
  <!-- Input de búsqueda -->
  <div class="relative flex flex-col">
    <label class="text-green-500 text-end text-[14px] font-bold">{{selectedList.length}}/{{maxTags}}</label>
    <ion-input
      mode="md"
      type="text"
      label-placement="floating"
      fill="outline"
      [label]="label"
      [(ngModel)]="searchText"
      (ionInput)="filtrarResultados($event)"
      (ionFocus)="filtrarResultados($event)"
      [placeholder]="placeholder"
      class="w-full"
    ></ion-input>
    <button type="button" [disabled]="!searchText.length" (click)="crea()" class="translate-y-[-100%] absolute right-2 top-[calc(50%+19px)] bg-transparent text-[#41C837] flex items-center justify-center text-[.9rem] font-bold z-10">crea</button>
  </div>

  <!-- Contenedor de resultados -->
  <div
    *ngIf="showDropdown"
    class="absolute w-full bg-white border border-gray-300 rounded-lg mt-1 shadow-lg max-h-48 overflow-auto z-50"
  >
    <div
      *ngFor="let item of filteredList"
      (click)="seleccionar(item)"
      class="px-4 py-2 hover:bg-gray-200 cursor-pointer"
    >
      {{ item }}
    </div>
  </div>

  <div class="flex flex-wrap mt-2">
    <div *ngFor="let item of selectedList" class="flex items-center border border-green-500 px-4 py-1 rounded-full m-1 relative">
      {{ item }}
      <div class="ml-2 w-5 h-5 flex items-center justify-center border border-red-500 text-red-500 rounded-full cursor-pointer" (click)="eliminar(item)">
        ✕
      </div>
    </div>
  </div>

</div>
