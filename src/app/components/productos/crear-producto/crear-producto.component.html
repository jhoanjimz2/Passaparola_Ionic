<app-header
  [border]="true"
  [backIcon]="true"
  [modalDismiss]="true"
></app-header>
<section class="h-full bg-white text-black overflow-y-auto p-4 relative">

  <form (ngSubmit)="crearProducto()" [formGroup]="form" class="scrollbar-hide h-full relative overflow-y-auto pb-[120px]">

    <div class="flex flex-row justify-between">
      <label class="text-[18px] font-bold text-[#000000]">Crea un nuovo prodotto</label>
    </div>

    <div class="grid grid-cols-2 justify-start my-8">
      <label class="flex items-center cursor-pointer">
        <input type="radio" formControlName="isFree" value="free" class="hidden peer" (change)="onOptionChange($event)"/>
        <span class="w-5 h-5 flex items-center justify-center bg-gray-200 text-white rounded peer-checked:bg-orange-500 peer-checked:text-white">
          <ng-container *ngIf="form.get('isFree')?.value === 'free'">✔</ng-container>
        </span>&nbsp;&nbsp;
        <span class="text-black">Gratuito</span>
      </label>

      <label class="flex items-center cursor-pointer">
        <input type="radio" formControlName="isFree" value="pay" class="hidden peer" (change)="onOptionChange($event)"/>
        <span class="w-5 h-5 flex items-center justify-center bg-gray-200 text-white rounded peer-checked:bg-orange-500 peer-checked:text-white">
          <ng-container *ngIf="form.get('isFree')?.value === 'pay'">✔</ng-container>
        </span>&nbsp;&nbsp;
        <span class="text-black">A pagamento</span>
      </label>
    </div>

    <div class="w-full overflow-x-auto scrollbar-hide">
      <div class="inline-grid grid-flow-col gap-2">
        <div (click)="openPhotoOptions(false)" class="w-[100px] aspect-square border border-solid border-[#E3E3E9] rounded-[.75rem] flex flex-col justify-center items-center text-center">
          <label class="text-[26px] font-bold text-black">+</label>
          <label class="text-[12px] text-black">aggiungi<br>un'immagine principale</label>
        </div>
        <div *ngIf="pictureUlrFile" class="w-[100px] aspect-square border border-solid border-[#E3E3E9] rounded-[.75rem] relative">
          <button (click)="eliminar(false)" class="absolute top-[1px] right-[1px] bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center">✖</button>
          <img [src]="pictureUlrFile" alt="Producto" class="w-full aspect-square rounded-[.75rem] object-cover"/>
        </div>
      </div>
    </div>

    <div class="w-full overflow-x-auto scrollbar-hide mt-[0.8rem]">
      <div class="inline-grid grid-flow-col gap-2">
        <div (click)="openPhotoOptions(true)" class="w-[100px] aspect-square border border-solid border-[#E3E3E9] rounded-[.75rem] flex flex-col justify-center items-center text-center">
          <label class="text-[26px] font-bold text-black">+</label>
          <label class="text-[12px] text-black">aggiungi<br>un'immagine galleria</label>
        </div>
        <div *ngFor="let imagen of pictureGallery" class="w-[100px] aspect-square border border-solid border-[#E3E3E9] rounded-[.75rem] relative">
          <button (click)="eliminar(false)" class="absolute top-[1px] right-[1px] bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center">✖</button>
          <img [src]="imagen" alt="Producto" class="w-full aspect-square rounded-[.75rem] object-cover"/>
        </div>
      </div>
    </div>


    <div class="grid grid-cols-12 mt-[0.8rem]">
      <div class="col-span-12">
        <ion-input
          mode="md" label-placement="floating" label="Nome prodotto"
          fill="outline" name="name" formControlName="name">
        </ion-input>
      </div>
    </div>

    <div class="grid grid-cols-12 mt-[0.8rem]">
      <div class="col-span-12">
        <ion-input
          mode="md" label-placement="floating" label="Descrizione breve"
          fill="outline" name="description" formControlName="description">
        </ion-input>
      </div>
    </div>

    <div class="grid grid-cols-12 mt-[0.8rem]">
      <div class="col-span-12">
        <ion-textarea
          mode="md" label-placement="floating" label="Descrizione lunga" rows="6"
          fill="outline" name="longDescription" formControlName="longDescription"/>
      </div>
    </div>


    <ion-select
      class="mt-[0.8rem] px-[16px] rounded-[.75rem] border border-solid border-[#E3E3E9]"
      [disabled]="true" label="Categoria" label-placement="floating" fill="solid" mode="ios">
      <ion-select-option *ngFor="let categoria of []" [value]="categoria">
        {{ categoria }}
      </ion-select-option>
    </ion-select>

    <div class="grid grid-cols-2 gap-2 mt-[0.8rem]">

      <div [ngClass]="form.controls['price'].disabled ? 'bg-[#E3E3E9]' : 'bg-white'" class="border relative rounded-xl p-1 grid items-center justify-center" onclick="this.querySelector('input').focus()">
        <label class="text-black block text-[14px] text-center italic">Prezzo pubblico</label>
        <label class="absolute font-bold text-[22px] text-[black] left-1 bottom-[1.2rem]">€</label>
        <input
            formControlName="price" name="price"
            class="w-full font-bold p-2 text-center bg-transparent h-[4rem] text-[2rem]"
            appDecimalValidator [decimalSeparator]="','" [min]="0" [max]="9999999.99" [maxIntegerDigits]="7" [allowDecimals]="true" />
        <ion-icon class="absolute  text-[22px] text-[black] right-1 bottom-[1.5rem]" src="assets/images/events/custom-icons/lock-closed.svg"/>
      </div>

      <div [ngClass]="form.controls['pr'].disabled ? 'bg-[#E3E3E9]' : 'bg-white'" class="border relative rounded-xl p-1 grid items-center justify-center" onclick="this.querySelector('input').focus()">
        <label class="text-black block text-[14px] text-center italic">Commissioni Passaparola</label>
        <label class="absolute font-bold text-[22px] text-[black] left-1 bottom-[1.2rem]">%</label>
        <input
            formControlName="pr" name="pr"
            class="w-full font-bold p-2 text-center bg-transparent h-[4rem] text-[2rem]"
            appDecimalValidator [decimalSeparator]="','" [min]="0" [max]="99.99" [maxIntegerDigits]="2" [allowDecimals]="true" />
        <ion-icon class="absolute  text-[22px] text-[black] right-1 bottom-[1.5rem]" src="assets/images/events/custom-icons/lock-closed.svg"/>
      </div>

    </div>

    <div class="mt-[0.8rem]">
      <app-autocomplete
        [buttonCrea]="true"
        [maxTags]="10"
        [placeholder]="'inizia a scrivere le tue parole chiave'"
        [label]="'Parole chiave'"
        [suggestedList]="availableTags"
        (selectedItem)="onTagsSelected($event)"
      ></app-autocomplete>
    </div>



    <div [ngClass]="{ 'fixed': !isKeyboardOpen }" class="flex flex-row justify-center items-center py-[22px] bottom-[0px] w-full gap-[20px] left-0 z-50">
      <div class="bg-white absolute h-full w-full"></div>
      <div class="flex justify-center items-center w-[150px] py-[10px] rounded-full border-[2px] border-[#FF8000] border-solid text-[#FF8000] font-bold z-10" (click)="onCancel()">{{ 'Annulla' }}</div>
      <button [disabled]="!form.valid || !pictureUlrFile || !pictureGallery.length" class="disabled:opacity-50 flex justify-center items-center w-[150px] py-[10px] rounded-full border-[2px] border-[#FF8000] border-solid bg-[#FF8000] text-white font-bold z-10" type="submit">{{ 'Salva' }}</button>
    </div>




  </form>

</section>
