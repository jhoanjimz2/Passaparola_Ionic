<app-header [backIcon]="true" [border]="true" [modalDismiss]="true"></app-header>
<ion-content [fullscreen]="true">
  <section class="h-full bg-white text-black overflow-y-auto p-4 relative">


    <div class="grid grid-cols-3">
      <label class="text-left col-span-2 text-[#000000] font-bold text-[1.1rem]">Profili di spedizione salvati</label>
      <label class="text-right col-span-1 text-[#FE8C0F] font-bold text-[1.1rem]" (click)="modalCreateEditAddress(false)">+nuovo</label>
    </div>

    <div *ngFor="let item of [2,1,1,1]" class="mt-4 grid grid-cols-3 gap-1 p-4 border border-solid border-[#E1E1E1] rounded-[.9rem]">

      <div class="col-span-2 flex flex-col justify-between">
        <div class="flex flex-col mb-3">
          <label class="text-black font-bold">Nome e cognome persona</label>
          <label class="text-black font-bold">+39 322 5451 444</label>
        </div>
        <div>
          <label>Via della Rivoluzione, 14, Bologna, 478854, Italia</label>
        </div>
      </div>


      <div class="text-right col-span-1 flex flex-col justify-between">
        <label class="text-[#2ABE2F] font-semibold italic">Mio</label>
        <label class="text-[#FE8C0F] font-semibold" (click)="modalCreateEditAddress(true)">modifica</label>
        <ion-icon *ngIf="item == 2" class="ml-auto text-[#2ABE2F] text-[1.3rem]" name="star"></ion-icon>
        <ion-icon *ngIf="item != 2" class="ml-auto text-transparent text-[1.3rem]" name="star"></ion-icon>
      </div>

    </div>

  </section>
</ion-content>
